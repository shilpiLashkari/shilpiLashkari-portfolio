<section id="skills" class="py-24 px-6 bg-gray-950">
    <div class="max-w-6xl mx-auto">
        <h2
            class="text-3xl md:text-4xl font-bold text-center mb-16 bg-gradient-to-br from-white to-gray-500 bg-clip-text text-transparent">
            Technical Arsenal
        </h2>

        <div class="relative flex flex-col items-center gap-12 max-w-5xl mx-auto z-10">

            <!-- Connection Line (Visual Guide) -->
            <div
                class="absolute inset-0 left-1/2 w-px bg-gradient-to-b from-fuchsia-500/0 via-fuchsia-500/20 to-fuchsia-500/0 -translate-x-1/2 -z-10 h-full">
            </div>

            <!-- Level 1: Frontend (Top) -->
            <div class="flex flex-col items-center w-full animate-fade-in-up delay-200">
                <h3
                    class="text-fuchsia-300 font-mono text-xs tracking-[0.2em] uppercase mb-6 opacity-80 bg-gray-950 px-4">
                    Frontend</h3>
                <div
                    class="flex flex-wrap justify-center gap-8 md:gap-12 px-8 py-6 bg-white/5 rounded-full backdrop-blur-sm border border-white/10 hover:border-fuchsia-500/30 transition-colors duration-500">

                    <!-- Angular -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/angular/angular-original.svg"
                            alt="Angular"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Angular</span>
                    </div>

                    <!-- React -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg"
                            alt="React"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg group-hover:animate-spin-slow" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">React</span>
                    </div>

                    <!-- TypeScript -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/typescript/typescript-original.svg"
                            alt="TypeScript"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">TypeScript</span>
                    </div>

                    <!-- Tailwind -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/tailwindcss/tailwindcss-original.svg"
                            alt="Tailwind"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Tailwind</span>
                    </div>
                </div>
            </div>

            <!-- Level 2: Backend (Middle) -->
            <div class="flex flex-col items-center w-full animate-fade-in-up delay-400">
                <h3 class="text-blue-300 font-mono text-xs tracking-[0.2em] uppercase mb-6 opacity-80 bg-gray-950 px-4">
                    Backend</h3>
                <div
                    class="flex flex-wrap justify-center gap-8 md:gap-12 px-12 py-6 bg-white/5 rounded-full backdrop-blur-sm border border-white/10 hover:border-blue-500/30 transition-colors duration-500">

                    <!-- Node.js -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nodejs/nodejs-original.svg"
                            alt="Node.js"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Node.js</span>
                    </div>

                    <!-- Python -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg"
                            alt="Python"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Python</span>
                    </div>

                    <!-- GraphQL -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/graphql/graphql-plain.svg"
                            alt="GraphQL"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">GraphQL</span>
                    </div>
                </div>
            </div>

            <!-- Level 3: Database & Infra (Bottom) -->
            <div class="flex flex-col items-center w-full animate-fade-in-up delay-600">
                <h3
                    class="text-emerald-300 font-mono text-xs tracking-[0.2em] uppercase mb-6 opacity-80 bg-gray-950 px-4">
                    Database & Cloud</h3>
                <div
                    class="flex flex-wrap justify-center gap-8 md:gap-12 px-16 py-6 bg-white/5 rounded-full backdrop-blur-sm border border-white/10 hover:border-emerald-500/30 transition-colors duration-500">

                    <!-- MongoDB -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mongodb/mongodb-original.svg"
                            alt="MongoDB"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">MongoDB</span>
                    </div>

                    <!-- Redis -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/redis/redis-original.svg"
                            alt="Redis"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Redis</span>
                    </div>

                    <!-- AWS -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <!-- Using plain-wordmark for readability or original if available -->
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/amazonwebservices/amazonwebservices-plain-wordmark.svg"
                            alt="AWS"
                            class="w-12 h-12 md:w-14 md:h-14 p-1 bg-white/10 rounded group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">AWS</span>
                    </div>

                    <!-- Git -->
                    <div class="group relative flex flex-col items-center cursor-pointer">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original.svg"
                            alt="Git"
                            class="w-12 h-12 md:w-14 md:h-14 group-hover:-translate-y-2 group-hover:scale-110 transition-all duration-300 drop-shadow-lg" />
                        <span
                            class="absolute -bottom-8 text-xs font-mono text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Git</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
