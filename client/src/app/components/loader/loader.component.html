<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black transition-opacity duration-700"
    [class.opacity-0]="!isLoading" [class.pointer-events-none]="!isLoading">

    <div class="font-mono text-fuchsia-500 text-lg md:text-xl p-8 max-w-2xl w-full">
        @for (line of terminalLines(); track $index) {
        <div class="mb-2">
            <span class="opacity-80">{{ line }}</span>
            <!-- Show cursor only on the last line regarding of typing status, or just always show at end? 
                     Let's show it on the last active line being typed. -->
            @if ($index === terminalLines().length - 1) {
            <span class="inline-block w-3 h-5 bg-fuchsia-500 ml-1 cursor-blink align-middle"></span>
            }
        </div>
        }
    </div>
</div>
