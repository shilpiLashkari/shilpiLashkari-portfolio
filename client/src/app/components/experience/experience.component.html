<section class="py-24 px-6 dark:bg-black bg-white transition-colors duration-300">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl md:text-5xl font-bold mb-20 text-center dark:text-white text-gray-900">
            {{ ts.t.experience.title }}
        </h2>

        <div class="relative ml-4 md:ml-0">
            <!-- Central Line (Background) -->
            <div
                class="absolute left-0 md:left-1/2 top-0 bottom-0 w-[2px] dark:bg-gray-900 bg-gray-200 -translate-x-1/2">
            </div>

            <!-- Growing Line (Interactive) -->
            <div #scrollLine
                class="absolute left-0 md:left-1/2 top-0 w-[2px] bg-fuchsia-500 -translate-x-1/2 transition-all duration-700 ease-out origin-top shadow-[0_0_15px_rgba(217,70,239,0.5)]"
                style="height: 0%"></div>

            <div class="space-y-24">
                <div *ngFor="let job of ts.t.experience.jobs; let i = index"
                    class="experience-item relative flex flex-col md:flex-row items-center gap-8 md:gap-0 reveal-on-scroll">

                    <!-- Dot -->
                    <div
                        class="absolute left-0 md:left-1/2 top-0 w-4 h-4 rounded-full dark:bg-black bg-white border-2 border-fuchsia-500 -translate-x-1/2 z-20 shadow-[0_0_10px_rgba(217,70,239,0.5)] group-hover:scale-125 transition-transform">
                    </div>

                    <!-- Left Content (Desktop) -->
                    <div class="w-full md:w-1/2 md:pr-16 md:text-right"
                        [ngClass]="{'md:order-1': i % 2 === 0, 'md:order-3': i % 2 !== 0}">
                        <span
                            class="inline-block px-4 py-1.5 bg-fuchsia-500/10 text-xs font-mono text-fuchsia-400 border border-fuchsia-500/20 rounded-full mb-4">
                            {{ job.period }}
                        </span>
                        <h3 class="text-2xl font-bold dark:text-white text-gray-900 mb-2">{{ job.company }}</h3>
                        <p class="text-lg font-medium dark:text-gray-400 text-gray-600 italic mb-6">{{ job.role }}</p>
                    </div>

                    <!-- Center Buffer -->
                    <div class="md:w-0 md:order-2"></div>

                    <!-- Right Content (Desktop) -->
                    <div class="w-full md:w-1/2 md:pl-16"
                        [ngClass]="{'md:order-3': i % 2 === 0, 'md:order-1': i % 2 !== 0}">
                        <div
                            class="dark:bg-gray-900/50 bg-gray-50 p-8 rounded-2xl border dark:border-gray-800 border-gray-200 hover:border-fuchsia-500/30 transition-all duration-500 dark:hover:bg-gray-900 hover:bg-white hover:shadow-lg group">
                            <p class="dark:text-gray-400 text-gray-600 leading-relaxed text-lg">
                                {{ job.desc }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
